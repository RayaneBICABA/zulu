
services:
  db:
    image: postgres:15-alpine
    container_name: zulu_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zulu_db}
      POSTGRES_USER: ${POSTGRES_USER:-zulu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zulu_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zulu_user} -d ${POSTGRES_DB:-zulu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zulu_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: zulu_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://zulu_user:zulu_pass@db:5432/zulu_db}
      FLASK_ENV: ${FLASK_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret}
      FRONTEND_URL: http://localhost:5173
      LIMITER_STORAGE_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command: flask run --host=0.0.0.0 --port=5000 --reload

volumes:
  pgdata:
