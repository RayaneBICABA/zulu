services:
  - type: web
    name: zawani-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zawani-db
          property: connectionString
      - key: LIMITER_STORAGE_URL
        fromService:
          name: zawani-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        value: https://zawani-api.onrender.com
      - key: FIREBASE_API_KEY
        value: AIzaSyBbeyWpC0nEEuZIuK5eONt0LDGYuKm038Q
      - key: FIREBASE_AUTH_DOMAIN
        value: zawani-aeba8.firebaseapp.com
      - key: FIREBASE_PROJECT_ID
        value: zawani-aeba8
      - key: FIREBASE_APP_ID
        value: 1:720010119224:web:5ec800f4f49883bbb43ecd
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLEAR_USERS_KEY
        value: zulu-clear-2024
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        value: 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
      - key: SENDGRID_FROM_EMAIL
        value: rayanebicaba.dev@gmail.com
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: zawani-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - source: /**
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: no-referrer-when-downgrade
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://zawani-api.onrender.com/api

  - type: keyvalue
    name: zawani-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: zawani-db
    plan: free
    region: oregon
    databaseName: zawani
    postgresMajorVersion: "16"
