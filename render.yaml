services:
  - type: web
    name: zawani-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zawani-db
          property: connectionString
      - key: LIMITER_STORAGE_URL
        fromService:
          name: zawani-redis
          type: keyvalue
          property: connectionString
      - key: FRONTEND_URL
        value: https://zawani-frontend.onrender.com
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://zawani-api.onrender.com/api/auth/google/callback
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLEAR_USERS_KEY
        value: zulu-clear-2024
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: zawani-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - source: /**
        headers:
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: no-referrer-when-downgrade
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://zawani-api.onrender.com

  - type: keyvalue
    name: zawani-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: zawani-db
    plan: free
    region: oregon
    databaseName: zawani
    postgresMajorVersion: "16"
