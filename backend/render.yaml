services:
  - type: web
    name: zulu-starter-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zulu-db
          property: connectionStringExternal

databases:
  - name: zulu-db
    databaseName: zulu_db
    user: zulu_user